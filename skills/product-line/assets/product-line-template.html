<main>
<div id="placeholder" class="notice"><p class="eyebrow">Продуктовая линейка</p><h1>Карта пока не заполнена</h1><p>Это автономный шаблон результата. После согласования карты агент добавит данные из вашего <strong>product-line.md</strong>.</p><p class="muted">Личные данные не передаются во внешние сервисы.</p></div>

</main>
<!-- Replace null with JSON derived from product-line.md. Escape every < as \u003c
     in JSON before inserting it here, so text cannot close this script element. -->
<script type="application/json" id="product-line-data">null</script>
<script>
'use strict';
(() => {

    strings(item,['from','to','kind','trigger','reason','action'],'Переход');
    requireValue(ids.has(item.from) && ids.has(item.to) && item.from !== item.to,'Переход ссылается на отсутствующий продукт или на себя.');

  if (d.entryBrief !== null) {
    strings(d.entryBrief,briefFields,'Бриф входного предложения');
    textList(d.entryBrief.outline,'Содержание брифа');
    requireValue(ids.has(d.entryBrief.offerId),'Бриф ссылается на отсутствующее предложение.');

  textList(d.test.signals,'Сигналы теста'); textList(d.unknowns,'Неизвестное');

function el(tag, text, className) { const node = document.createElement(tag); if (text !== undefined) node.textContent = text; if (className) node.className = className; return node; }

function offerCard(offer) {

}
function readable(d) {

    Object.entries(detailLabels).forEach(([key,label]) => parts.push(label + ': ' + offer[key]));
  }

  if (d.entryBrief) {
    parts.push('\nБриф входного предложения');
    const labels = {title:'Название',recipient:'Для кого',problem:'Задача',result:'Результат',format:'Формат',rationale:'Почему подходит',outline:'Что внутри',sample:'Полезный пример',delivery:'Как получить',cta:'Приглашение дальше',check:'Как проверить'};

  header.append(append(el('div',undefined,'meta'),el('span','Обновлено: ' + d.meta.updated),el('span',d.meta.scope)));
  header.append(append(el('div',undefined,'next'),el('span','Следующее действие','role'),el('p',d.nextStep)));

      link.append(el('span',kinds[t.kind],'role'),el('h3',byId.get(t.from).name + ' → ' + byId.get(t.to).name),fact('Когда уместно',t.trigger),fact('Почему',t.reason),fact('Действие',t.action)); links.append(link);

  const head = el('thead'); const hr = el('tr'); ['Роль / предложение','Покупатель и результат','Формат и цена','Состояние / приоритет','Границы'].forEach(label => { const th = el('th',label); th.scope = 'col'; hr.append(th); }); head.append(hr); table.append(head);

  }
  table.append(body); tableSection.append(append(el('div',undefined,'table-wrap'),table)); tableView.append(tableSection); fragment.append(map,tableView);

  d.roleDecisions.forEach(r => decisionList.append(append(el('li'),el('strong',roles[r.role] + ' · ' + r.decision),el('span',r.reason)))); decisions.append(decisionList); fragment.append(decisions);
