name: Проверка агента и скиллов

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v5

      - name: Установить инструменты проверки
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Проверить структуру агента
        run: bash tests/test-system-business-template.sh

      - name: Проверить скилл распаковки
        run: bash tests/test-expertise-unpacking.sh

      - name: Проверить установку в Claude и Codex
        run: bash tests/test-expertise-installation.sh

      - name: Проверить скилл выбора продукта
        run: bash tests/test-product-selection.sh

      - name: Проверить установку скилла выбора продукта
        run: bash tests/test-product-selection-installation.sh

      - name: Проверить упаковку продукта и локальную установку
        run: bash tests/test-product-packaging.sh

      - name: Проверить установку сценариста коротких роликов
        run: bash tests/test-short-video-installation.sh

      - name: Проверить скилл прогрева аудитории
        run: bash tests/test-audience-warmup.sh

      - name: Проверить установку скилла прогрева
        run: bash tests/test-audience-warmup-installation.sh

      - name: Проверить обновление устаревшего установщика
        run: bash tests/test-installer-refresh.sh

      - name: Проверить пакет продуктовой линейки
        run: bash tests/test-product-line.sh

      - name: Проверить установку линейки в старую и новую версию агента
        run: bash tests/test-product-line-installation.sh

      - name: Установить Node для проверки автономного HTML
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установить браузер только для проверки
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Проверить HTML продуктовой линейки
        run: node tests/check-product-line-html.cjs
